; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
build_flags = -Wno-sign-compare
lib_deps =
	sandeepmistry/LoRa@^0.8.0
	robtillaart/CRC@^1.0.4
	rweather/Crypto@^0.4.0
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
upload_port = COM4
monitor_port = COM4
upload_speed = 115200
monitor_speed = 115200

[env:nodemcu-32s-ota]
platform = espressif32
board = nodemcu-32s
framework = arduino
build_flags = -Wno-sign-compare
lib_deps =
	sandeepmistry/LoRa@^0.8.0
	robtillaart/CRC@^1.0.4
	rweather/Crypto@^0.4.0
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
; Upload firmware over WiFi via ArduinoOTA instead of USB serial.
; Requires the device to already be running firmware with OTA enabled
; and connected to WiFi. Update upload_port to match OTA_HOSTNAME in
; include/Config.h (defaults to "lora-gateway"), or use the device's
; IP address if mDNS resolution does not work on your network.
; If OTA_PASSWORD is set in include/secrets.h, uncomment upload_flags below.
upload_protocol = espota
upload_port = lora-gateway.local
; upload_flags =
; 	--auth=YOUR_OTA_PASSWORD
monitor_port = COM4
monitor_speed = 115200

[env:native-test]
platform = native
test_framework = unity
build_flags = -I test
debug_tool = gdb
